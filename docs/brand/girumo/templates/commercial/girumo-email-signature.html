<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Assinatura de e-mail Girumo</title>
</head>
<body style="margin:0;padding:28px;background:#fffefa;color:#071923;font-family:'IBM Plex Sans',Arial,sans-serif">
  <!-- Antes de usar, substitua {{logo_url}} pela URL HTTPS pública e absoluta do asset girumo-email-lockup-640x160.png. -->
  <!-- Copie a tabela inteira para o editor de assinatura. Preserve os demais placeholders até preencher os dados. -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;max-width:620px;background:#fffefa">
    <tr>
      <td style="padding:0 24px 0 0;vertical-align:top">
        <img src="{{logo_url}}" width="180" height="45" alt="Girumo" style="display:block;width:180px;height:45px;border:0" />
        <span style="display:block;width:36px;height:4px;margin-top:12px;background:#a7ff2f"></span>
      </td>
      <td style="padding:0 0 0 24px;vertical-align:top">
        <p style="margin:0 0 3px;font-family:'Manrope',Arial,sans-serif;font-size:20px;line-height:24px;font-weight:700;color:#071923">{{nome}}</p>
        <p style="margin:0 0 12px;font-size:12px;line-height:17px;color:#52646c">{{cargo}}</p>
        <p style="margin:0;font-size:12px;line-height:19px;color:#071923"><span style="font-weight:600">Telefone</span> {{telefone}}<br /><span style="font-weight:600">E-mail</span> {{email}}<br /><span style="font-weight:600">Site</span> {{site}}</p>
        <p style="margin:12px 0 0;font-size:12px;line-height:17px;color:#52646c">Seus grupos rodando. Você vendendo.</p>
      </td>
    </tr>
  </table>
</body>
</html>

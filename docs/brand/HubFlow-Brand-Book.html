document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Grotesque',sans-serif; font-weight:800; font-size:110px; line-height:0.9; letter-spacing:-0.04em; margin:20px 0 0; color:#ECEBF5;\">Hub<span style=\"color:#8A6CFF;\">Flow<\u002Fspan><\u002Fh1>\n        <p style=\"font-family:'Instrument Serif',serif; font-style:italic; font-size:28px; line-height:1.4; color:#9A98AE; margin:28px 0 0; max-width:600px;\">O painel que conecta seus grupos de WhatsApp e transforma caos em canal previsível de vendas.<\u002Fp>\n        <div style=\"display:flex; gap:24px; margin-top:48px; flex-wrap:wrap;\">\n          <div style=\"display:flex; flex-direction:column; gap:5px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#5B5E75;\">Categoria<\u002Fspan><span style=\"font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:#ECEBF5;\">SaaS B2B · WhatsApp Commerce<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:5px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#5B5E75;\">Público<\u002Fspan><span style=\"font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:#ECEBF5;\">Lojistas e atacadistas · 30–48<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:5px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#5B5E75;\">Direção<\u002Fspan><span style=\"font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:#ECEBF5;\">B · Corrente<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; justify-content:center; padding:56px; border-radius:28px; background:linear-gradient(150deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); border:1px solid rgba(236,235,245,0.1);\">\n        <div style=\"position:relative;\">\n          <div style=\"position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(106,75,240,0.4), transparent 70%); filter:blur(20px); top:50%; left:50%; transform:translate(-50%,-50%);\"><\u002Fdiv>\n          <svg width=\"200\" height=\"200\" viewBox=\"0 0 120 120\" fill=\"none\" style=\"position:relative; filter:drop-shadow(0 0 20px rgba(106,75,240,0.5));\">\n            <rect x=\"14\" y=\"24\" width=\"50\" height=\"72\" rx=\"21\" fill=\"none\" stroke=\"url(#iris)\" stroke-width=\"15\"><\u002Frect>\n            <rect x=\"56\" y=\"24\" width=\"50\" height=\"72\" rx=\"21\" fill=\"none\" stroke=\"url(#iris)\" stroke-width=\"15\"><\u002Frect>\n            <path d=\"M56 45 a21 21 0 0 1 0 30\" fill=\"none\" stroke=\"#0B0D1A\" stroke-width=\"15\"><\u002Fpath>\n            <path d=\"M56 45 a21 21 0 0 1 0 30\" fill=\"none\" stroke=\"url(#iris)\" stroke-width=\"15\"><\u002Fpath>\n            <rect x=\"14\" y=\"24\" width=\"50\" height=\"72\" rx=\"21\" fill=\"none\" stroke=\"#C9BBFF\" stroke-width=\"1\" opacity=\"0.25\"><\u002Frect>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1140px; margin:0 auto; padding:0 48px 40px; display:flex; justify-content:space-between; align-items:center; width:100%; border-top:1px solid rgba(236,235,245,0.1); padding-top:24px;\">\n    <div style=\"display:flex; gap:48px;\">\n      <div><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#5B5E75;\">Conteúdo<\u002Fdiv><div style=\"font-family:'IBM Plex Sans',sans-serif; font-size:14px; color:#9A98AE; margin-top:4px;\">Estratégia · Logo · Cor · Tipo · UI · Posts<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ░░ 01 ESTRATÉGIA ░░ -->\n<section style=\"width:100%; padding:96px 48px 0; background:#ECEBF5;\">\n  <div style=\"max-width:1140px; margin:0 auto;\">\n    <div style=\"display:flex; align-items:baseline; gap:20px; margin-bottom:40px;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.14em; color:#6A4BF0;\">01<\u002Fspan>\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:42px; letter-spacing:-0.03em; margin:0; color:#0B0D1A;\">Estratégia<\u002Fh2>\n    <\u002Fdiv>\n    <hr class=\"section-rule\">\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n      <div style=\"background:#fff; border:1px solid rgba(11,13,26,0.1); border-radius:16px; padding:36px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6A4BF0;\">Missão<\u002Fspan>\n        <p style=\"font-family:'IBM Plex Sans',sans-serif; font-size:20px; line-height:1.5; color:#0B0D1A; margin:16px 0 0;\">Dar ao lojista e ao atacadista o controle simples de transformar grupos de WhatsApp em vendas previsíveis que ele consegue repetir e crescer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid rgba(11,13,26,0.1); border-radius:16px; padding:36px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6A4BF0;\">Visão<\u002Fspan>\n        <p style=\"font-family:'IBM Plex Sans',sans-serif; font-size:20px; line-height:1.5; color:#0B0D1A; margin:16px 0 0;\">Ser o sistema operacional de vendas por WhatsApp do comércio brasileiro — referência de resultado, não de complexidade.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0B0D1A; border-radius:16px; padding:52px 56px; margin-top:24px; position:relative; overflow:hidden;\">\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse 60% 80% at 100% 50%, rgba(106,75,240,0.2), transparent 60%); pointer-events:none;\"><\u002Fdiv>\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6A4BF0; position:relative;\">Manifesto<\u002Fspan>\n      <p style=\"font-family:'IBM Plex Sans',sans-serif; font-size:22px; line-height:1.6; color:#ECEBF5; margin:20px 0 0; max-width:880px; position:relative;\">O grupo lota e ninguém sabe o que fez vender. A campanha some no meio das conversas. O atendimento vira bagunça e o lucro vira sorte.<br><br>A HubFlow existe pra acabar com o \"achismo\". Cada grupo organizado. Cada campanha no horário certo. Cada número à vista.<br><br>O que antes dependia de suor e sorte vira <span style=\"color:#8A6CFF; font-weight:500;\">processo<\u002Fspan> — simples o bastante pra rodar no balcão, sério o bastante pra crescer como empresa.<br><br><strong style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:26px; letter-spacing:-0.01em; color:#ECEBF5;\">Menos correria. Mais vendas. No controle.<\u002Fstrong><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:48px;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#3A3F5C;\">20 territórios de slogan<\u002Fspan>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:0 40px; margin-top:20px;\">\n        <div style=\"display:flex; gap:16px; padding:13px 0; border-bottom:1px solid rgba(11,13,26,0.08);\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#9A98AE; width:24px; flex-shrink:0;\">01<\u002Fspan><span style=\"font-family:'IBM Plex Sans',sans-serif; font-size:16px; color:#0B0D1A;\">Seu grupo, no controle.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:16px; padding:13px 0; border-bottom:1px solid rgba(11,13,26,0.08);\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#9A98AE; width:24px; flex-shrink:0;\">02<\u002Fspan><span style=\"font-family:'IBM Plex Sans',sans-serif; font-size:16px; color:#0B0D1A;\">Vender no WhatsApp virou previsível.<\u002Fspan><\u002Fdiv>\n

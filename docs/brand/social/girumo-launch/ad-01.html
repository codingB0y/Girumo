<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Girumo — Antes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--volt-950:#071923; --volt-900:#0C2835; --acid:#A7FF2F; --canvas:#F4F0E7; --paper:#FFFEFA; --slate:#52646C; --line:#D8D7CF}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#333}
  .canvas{position:relative; width:1080px; height:1350px; overflow:hidden;
    background:var(--canvas); color:var(--volt-950); font-family:'Manrope',sans-serif}
  .frame{position:absolute; inset:0; padding:84px 88px; display:flex; flex-direction:column}

  .top{display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:19px; letter-spacing:.16em; text-transform:uppercase; color:var(--slate)}
  /* tab pair */
  .tabs{display:flex; gap:10px}
  .tab{padding:9px 20px; font-family:'IBM Plex Mono',monospace; font-size:17px; letter-spacing:.14em; border:1px solid var(--line)}
  .tab.on{background:var(--volt-950); color:var(--canvas); border-color:var(--volt-950)}
  .tab.off{color:var(--slate)}

  .head{margin-top:70px; font-weight:800; font-size:130px; line-height:.9; letter-spacing:-.04em; color:var(--volt-950)}
  .sub{margin-top:18px; font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:.06em; color:var(--slate)}

  .list{margin-top:64px; display:flex; flex-direction:column; gap:0}
  .row{display:flex; align-items:center; gap:26px; padding:28px 0; border-bottom:1px solid var(--line)}
  .row:first-child{border-top:1px solid var(--line)}
  .x{flex:none; width:40px; height:40px; position:relative}
  .x::before,.x::after{content:''; position:absolute; left:50%; top:50%; width:34px; height:3px; background:var(--slate); transform-origin:center}
  .x::before{transform:translate(-50%,-50%) rotate(45deg)}
  .x::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .row span{font-weight:600; font-size:40px; letter-spacing:-.02em; color:#6b7a80}

  .foot{margin-top:auto; padding-top:26px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate)}
  .foot .wm{display:flex; align-items:center; gap:14px; color:var(--volt-950); font-family:'Manrope'; font-weight:800; font-size:26px; letter-spacing:-.03em; text-transform:none}
  .foot .wm .sym{width:28px;height:28px;color:var(--volt-950)}
  .foot .wm .sym svg{width:100%;height:100%;display:block}
  .swipe{display:flex; align-items:center; gap:10px}
  .swipe .arw{width:34px;height:2px;background:var(--volt-950);position:relative}
  .swipe .arw::after{content:'';position:absolute;right:0;top:-4px;width:9px;height:9px;border-top:2px solid var(--volt-950);border-right:2px solid var(--volt-950);transform:rotate(45deg)}
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame">
      <div class="top">
        <div class="tabs"><span class="tab on">ANTES</span><span class="tab off">DEPOIS</span></div>
        <span>Girumo&trade;</span>
      </div>

      <div class="head">Antes.</div>
      <div class="sub">o jeito que cansa // sem a Girumo</div>

      <div class="list">
        <div class="row"><span class="x"></span><span>Respondendo tudo no braço</span></div>
        <div class="row"><span class="x"></span><span>Cliente entra no grupo e some</span></div>
        <div class="row"><span class="x"></span><span>Campanha que você esquece de mandar</span></div>
        <div class="row"><span class="x"></span><span>Venda que não dá pra medir</span></div>
        <div class="row"><span class="x"></span><span>O dia todo preso no celular</span></div>
      </div>

      <div class="foot">
        <span class="wm">
          <span class="sym"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M5 2H12V10H9V22H5A3 3 0 0 1 2 19V5A3 3 0 0 1 5 2Z"/><path fill="currentColor" d="M14 2H19A3 3 0 0 1 22 5V19A3 3 0 0 1 19 22H11V14H14V2Z"/></svg></span>
          Girumo
        </span>
        <span class="swipe">arraste <span class="arw"></span></span>
      </div>
    </div>
  </div>
</body>
</html>

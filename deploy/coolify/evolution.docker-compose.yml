# GIRUMO — Evolution API v2 (Coolify/VPS)
# Substitui a engine Baileys (engine.docker-compose.yml) a partir da F5.
#
# Segurança (checklist da migração):
#  - Imagens PINADAS (nunca :latest). Verifique a tag no Docker Hub antes do deploy.
#  - Postgres e Redis SEM porta no host (só rede interna girumo-net).
#  - Evolution exposta apenas via proxy do Coolify (HTTPS + domínio), nunca host port.
#  - AUTHENTICATION_API_KEY forte (>=32 bytes) = EVOLUTION_API_KEY na Vercel/worker.
#  - Manager UI (/manager) fechada pelo servico `evolution-gateway` (403), que e
#    quem recebe o dominio publico. A Evolution nao fica mais exposta direto.
#  - Webhook é POR INSTÂNCIA (setWebhook na F2), não global.

networks:
  girumo-net:
    driver: bridge

services:
  evolution:
    image: evoapicloud/evolution-api:${EVOLUTION_IMAGE_TAG:-v2.3.7}
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    # Sem `ports:` — o proxy do Coolify mapeia o domínio HTTPS para a porta 8080.
    expose:
      - "8080"
    environment:
      SERVER_URL: ${SERVER_URL}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}

      # Banco (Prisma/Postgres próprio da stack)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/${EVOLUTION_DB_NAME:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: girumo_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # Cache Redis próprio da stack
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/${EVOLUTION_REDIS_DB:-6}
      CACHE_REDIS_PREFIX_KEY: girumo_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Webhook global desligado — Girumo configura webhook por instância (F2).
      WEBHOOK_GLOBAL_ENABLED: "false"

      # Sessão/QR
      CONFIG_SESSION_PHONE_CLIENT: Girumo
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"

      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      LOG_BAILEYS: error
      LANGUAGE: pt-BR
      TELEMETRY: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - girumo-net
    healthcheck:
      # Ajuste se a imagem não tiver wget (Evolution v2 é node/alpine — geralmente tem busybox wget).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sem `ports:` — acessível só pela rede interna girumo-net.
    environment:
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - girumo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Sem `ports:` — acessível só pela rede interna girumo-net.
    volumes:
      - evolution_redisdata:/data
    networks:
      - girumo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # Gateway HTTP — a ÚNICA porta que o proxy do Coolify publica no domínio.
  # Repassa tudo para a Evolution, menos o console admin `/manager`, que responde
  # 403. Existe porque a Evolution v2 serve o manager pelo próprio Express e não
  # tem env pra desligá-lo: o corte precisa acontecer antes dela.
  #
  # ATENÇÃO: no Coolify o domínio (wa.girumo.com.br) tem que apontar para ESTE
  # serviço na porta 80 — não mais para `evolution:8080`. Ver README.evolution.md.
  evolution-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      evolution:
        condition: service_healthy
    # Sem `ports:` — quem publica no host é o proxy do Coolify.
    expose:
      - "80"
    networks:
      - girumo-net
    # Config inline: a stack no Coolify não tem os arquivos do repo montados, então
    # o nginx.conf é escrito no boot. `$$` é escape do Compose e chega como `$`.
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINXCONF'
        server {
          listen 80;
          server_name _;

          # Mídia sai em base64 no corpo do POST; o default do nginx (1m) cortaria
          # o envio. Não baixar sem medir o maior payload real.
          client_max_body_size 100m;

          # DNS interno do Docker, reavaliado a cada 10s. Sem isso o nginx fixa o IP
          # da Evolution no boot e para de achá-la quando o container dela reinicia.
          resolver 127.0.0.11 valid=10s ipv6=off;

          # Prova de vida do próprio gateway, sem depender da Evolution — senão uma
          # Evolution fora do ar deixaria o gateway unhealthy e em restart loop.
          location = /healthz {
            access_log off;
            return 200 "ok\n";
          }

          # Console admin da Evolution: fechado. A API REST segue aberta (protegida
          # pela apikey) — o que sai do ar é só a UI, que o painel do Girumo não usa.
          location ^~ /manager {
            return 403;
          }

          location / {
            set $$evo http://evolution:8080;
            proxy_pass $$evo$$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$http_connection;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
          }
        }
        NGINXCONF
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  evolution_instances:
  evolution_store:
  evolution_pgdata:
  evolution_redisdata:

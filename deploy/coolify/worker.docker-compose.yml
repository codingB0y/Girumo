services:
  girumo-worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    # 1 réplica: o claim usa FOR UPDATE SKIP LOCKED, então escalar é seguro no
    # futuro, mas na F3 uma réplica dá conta e simplifica a observabilidade.
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-3000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_REQUEUE_AFTER_SECONDS: ${WORKER_REQUEUE_AFTER_SECONDS:-300}
      WORKER_HEALTH_PORT: 3002
      # F4 — loop de ENVIO. Sem estas duas o worker roda só a captura de leads.
      # Na rede girumo-net o worker fala com a Evolution pelo nome do serviço
      # (http://evolution:8080), não pelo domínio público. Ver README.evolution.md.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WORKER_SEND_BATCH_SIZE: ${WORKER_SEND_BATCH_SIZE:-10}
      # DRY-RUN por default: o loop de envio roda inteiro (claim sob anti-ban,
      # instância, mídia, record_send, complete) e loga o que enviaria, sem chamar
      # a Evolution. Só vire "true" depois de ler os logs `DRY-RUN: enviaria ...`
      # e conferir que todo destino é `@g.us`.
      WORKER_SEND_ENABLED: ${WORKER_SEND_ENABLED:-false}
      # Ponte com o app web. Sem estas duas, DOIS loops se desligam em silêncio no
      # boot — auto-grow e ações em massa — porque ambos falam HTTP com o app (a
      # decisão de o que fazer mora lá, em store `server-only`; o worker só
      # executa). O sintoma é cruel: nenhum erro, só uma fila que nunca drena.
      #
      # ENGINE_TOKEN precisa ser o MESMO valor que está na Vercel: as rotas
      # comparam em constant-time e, divergindo, o worker leva 401 para sempre.
      APP_URL: ${APP_URL}
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      # Auto-grow (criação de grupo). O intervalo É o anti-ban: com 1 criação por
      # tenant por ciclo, 5 min dá ~2/10min. Baixar afrouxa o teto.
      WORKER_GROW_ENABLED: ${WORKER_GROW_ENABLED:-false}
      WORKER_GROW_INTERVAL_MS: ${WORKER_GROW_INTERVAL_MS:-300000}
      # Ações em massa (foto, descrição, abrir/fechar em grupo que já existe).
      # Mesma lógica: o intervalo é METADE do anti-ban — com 1 operação por tenant
      # por tick, 4s dá ~15/min ESPAÇADOS. Quinze numa rajada e 55s parado seria o
      # mesmo número por minuto e o padrão de automação que se quer evitar.
      #
      # DRY-RUN por default: o loop roda inteiro (claim real, instância, assinatura
      # da mídia) e para na porta da Evolution. Só vire "true" depois de ler os
      # logs `DRY-RUN: fecharia o grupo ...` e conferir que os JIDs são os certos —
      # são 91 grupos de uma vez.
      WORKER_BULK_ENABLED: ${WORKER_BULK_ENABLED:-false}
      WORKER_BULK_INTERVAL_MS: ${WORKER_BULK_INTERVAL_MS:-4000}
    # Sem `ports:` de propósito: o worker não recebe tráfego, só fala com o
    # Supabase (HTTPS de saída) e com a Evolution (rede interna). /health é interno.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Anexa à rede da stack da Evolution (definida em evolution.docker-compose.yml)
    # para resolver `http://evolution:8080`. É outra stack, então a rede entra como
    # externa. Coolify pode prefixar o nome — sobrescreva com EVOLUTION_NETWORK.
    networks:
      - evolution-net

networks:
  evolution-net:
    external: true
    name: ${EVOLUTION_NETWORK:-girumo-net}

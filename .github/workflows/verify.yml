name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Linux, nao Windows: runner Windows consome minutos em dobro e tem fila bem
    # pior — em 06/08/2026 este job esperou 15 min por uma maquina e foi
    # cancelado sem rodar um unico passo. Os scripts .ps1 usam so cmdlets
    # portateis, e o pwsh ja vem instalado no runner ubuntu.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chama o script direto: o npm script `verify:local` invoca `powershell`,
      # que so existe no Windows. O script em si e cross-platform.
      - run: pwsh -File infra/scripts/verify-local.ps1

  # Gate de drift de schema dev x prod (D.4 da auditoria de 22/08/2026).
  #
  # Precisa existir porque o job `e2e` abaixo roda contra o Supabase de DEV:
  # enquanto os dois schemas divergirem, a suite verde nao e evidencia sobre
  # producao. Em 22/08 dev tinha `plans.price_cents` e prod nao, e o E2E ficou
  # verde enquanto /admin/billing mostrava MRR R$ 0,00 em producao.
  #
  # Conecta so em DEV: a assinatura de prod e versionada em
  # deploy/supabase/schema-baseline.json. Nao existe chave de producao no CI, e
  # a decisao foi deliberada — uma service-role de prod aqui leria tudo.
  #
  # Roda antes do e2e de proposito: leva segundos, e drift de schema explica a
  # maior parte das falhas do e2e.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Mesmo padrao do job e2e: sem segredo o job vira aviso, nao vermelho.
      # PR de fork nao recebe segredo, e CI vermelho por falta de credencial
      # ensina o time a ignorar o gate.
      - id: credenciais
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "### Gate de drift pulado: faltam os segredos E2E_SUPABASE_* no repositorio." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.credenciais.outputs.tem == 'true'
        run: npm ci

      - if: steps.credenciais.outputs.tem == 'true'
        name: Assinatura de schema dev x baseline de prod
        run: npm run check:drift
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}

  # Smoke E2E do painel. Existe desde 19/08/2026, mas ate agora so rodava na
  # maquina de quem lembrasse — e suite que so roda quando alguem lembra e
  # suite que nao pega regressao. Aponta para o Supabase de DEV.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serializa: este job fala com o Supabase de DEV, que e um so para todos os
    # runs. O teste da cadeia de automacao chama `claim_send_commands`, que e a
    # fila GLOBAL do worker e nao aceita filtro de tenant — entao dois runs ao
    # mesmo tempo se roubam o comando e um deles reprova sem ter nada errado no
    # codigo. Aconteceu em 24/08/2026: os PRs #143 e #144 foram mergeados com 4
    # segundos de diferenca e os dois runs de main quebraram no mesmo assert.
    #
    # O tenant com UUID novo a cada execucao isola as LEITURAS do teste, mas nao
    # protege contra o claim alheio; por isso a serializacao mora aqui e nao no
    # fixture.
    #
    # cancel-in-progress: false porque cancelar o run que ja esta rodando
    # desperdicaria a validacao inteira por causa de um push que chegou depois.
    concurrency:
      group: e2e-supabase-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Sem os segredos o job vira aviso, nao vermelho: quem clona o repo (ou
      # abre PR de fork) nao tem acesso a eles, e CI vermelho por falta de
      # segredo ensina o time a ignorar a suite.
      - id: credenciais
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$E2E_EMAIL" ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "### E2E pulado: faltam os segredos E2E_* no repositorio." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.credenciais.outputs.tem == 'true'
        run: npm ci

      # Cadeia de automacao (gatilho -> run -> comando -> claim) contra o banco
      # de DEV. Roda antes do build de proposito: leva ~10s e o build leva
      # minutos, entao a cadeia quebrada aparece rapido em vez de no fim.
      #
      # No job `verify` este mesmo teste roda sem SUPABASE_* e se auto-pula. So
      # aqui ele tem credencial, e so aqui ele prova alguma coisa.
      #
      # Nao manda mensagem para ninguem: nenhum EvolutionSender e construido no
      # arquivo, e os fixtures vivem num tenant com UUID novo a cada execucao.
      - if: steps.credenciais.outputs.tem == 'true'
        name: Integracao da cadeia de automacao (Supabase de dev)
        run: npm --workspace apps/worker exec -- tsx --test src/cadeia-automacao.integration.test.ts
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}

      - if: steps.credenciais.outputs.tem == 'true'
        run: npm --workspace apps/web exec -- playwright install --with-deps chromium

      # O build precisa das NEXT_PUBLIC_*: elas sao embutidas no bundle, entao
      # defini-las so no passo do teste chegaria tarde demais.
      - if: steps.credenciais.outputs.tem == 'true'
        run: npm run web:build
        env:
          HUBFLOW_USE_SUPABASE: "1"
          # Sem isto o app se declara `production` (NODE_ENV do `next start`) e
          # passa a cobrar Stripe e Evolution, que o smoke nao exercita.
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
          # Placeholders declarados, nao segredos: nao existe engine nem cron no
          # CI. Estao aqui porque o instrumentation hook exige valor nao-vazio
          # em runtime de producao, e sem eles o servidor nao chega a subir.
          ENGINE_TOKEN: ci-sem-engine-nao-usado
          CRON_SECRET: ci-sem-cron-nao-usado

      - if: steps.credenciais.outputs.tem == 'true'
        run: npm run web:e2e
        env:
          # `next start` sobre o build acima; `next dev` compilaria rota a rota
          # dentro do timeout de cada teste.
          E2E_WEB_COMMAND: npm run start
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # Segundo usuario: admin de plataforma, so para a cobertura de /admin
          # (D.2). Ausentes, o spec se marca skip e o resto da suite segue.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          HUBFLOW_USE_SUPABASE: "1"
          # Sem isto o app se declara `production` (NODE_ENV do `next start`) e
          # passa a cobrar Stripe e Evolution, que o smoke nao exercita.
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
          # Placeholders declarados, nao segredos: nao existe engine nem cron no
          # CI. Estao aqui porque o instrumentation hook exige valor nao-vazio
          # em runtime de producao, e sem eles o servidor nao chega a subir.
          ENGINE_TOKEN: ci-sem-engine-nao-usado
          CRON_SECRET: ci-sem-cron-nao-usado

      # Precisa vir ANTES do upload: o Playwright serializa o valor dos campos
      # no error-context, no relatorio e dentro do trace.zip — inclusive de
      # input type=password. Sem este passo, teste autenticado que falha
      # publica a senha do usuario de QA num artefato que qualquer pessoa com
      # leitura no repositorio baixa, sem precisar ler segredo nenhum.
      - if: always() && steps.credenciais.outputs.tem == 'true'
        run: python3 infra/scripts/redigir-segredos-e2e.py
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      # O relatorio e a prova que o quadro exige para mover card a
      # `no_ar_verificado`; sem anexo, falha no CI vira "deu vermelho" sem
      # screenshot de nada.
      - if: always() && steps.credenciais.outputs.tem == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/e2e-report
            apps/web/e2e-results
          retention-days: 14
